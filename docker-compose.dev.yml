
# ============================================================
# 开发环境配置（Windows 本地开发用）
# 用法：docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# 与生产环境的区别：
#   - 挂载本地代码目录，支持热重载
#   - 启用 DEBUG 模式
#   - 暴露更多端口供调试
# ============================================================

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    volumes:
      # 挂载本地代码（热重载）
      - ./app:/app
      - pageindex_data:/data/pageindex_index
      - temp_data:/data/temp
      - uploads_data:/data/uploads
    environment:
      - APP_DEBUG=true
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    volumes:
      # 挂载本地代码
      - ./app:/app
      - pageindex_data:/data/pageindex_index
      - temp_data:/data/temp
      - uploads_data:/data/uploads
    environment:
      - APP_DEBUG=true
    command: >
      celery -A tasks.celery_app worker
      --loglevel=debug
      --concurrency=2
      -Q celery,documents

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
