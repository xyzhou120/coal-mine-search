
# ============================================================
# 煤矿文档检索系统 - Docker Compose 部署配置
#
# 使用方法：
#   1. 复制 .env.example 为 .env 并填写配置
#   2. docker-compose up -d
#   3. 访问 http://localhost/docs 查看 API 文档
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL 数据库
  # ----------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: coal_mine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coal_mine_search}
      POSTGRES_USER: ${POSTGRES_USER:-coal_mine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coal_mine} -d ${POSTGRES_DB:-coal_mine_search}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coal_mine_net

  # ----------------------------------------------------------
  # Redis（Celery 消息队列 + 结果后端）
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: coal_mine_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coal_mine_net

  # ----------------------------------------------------------
  # FastAPI 应用服务
  # ----------------------------------------------------------
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: coal-mine-search-app:latest
    container_name: coal_mine_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - pageindex_data:/data/pageindex_index
      - temp_data:/data/temp
      - uploads_data:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - coal_mine_net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  # ----------------------------------------------------------
  # Celery Worker（文档异步处理）
  # 可通过 --scale worker=N 横向扩展
  # ----------------------------------------------------------
  worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: coal-mine-search-app:latest
    container_name: coal_mine_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - pageindex_data:/data/pageindex_index
      - temp_data:/data/temp
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - coal_mine_net
    command: >
      celery -A app.tasks.celery_app worker
      --loglevel=info
      --concurrency=${CELERY_WORKER_CONCURRENCY:-5}
      -Q celery,documents

  # ----------------------------------------------------------
  # Nginx 反向代理
  # ----------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: coal_mine_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - coal_mine_net

# ----------------------------------------------------------
# 数据卷（持久化存储）
# ----------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pageindex_data:
    driver: local
    # 生产环境建议挂载到大容量磁盘，例如：
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/coal-mine/pageindex_index
  temp_data:
    driver: local
  uploads_data:
    driver: local

# ----------------------------------------------------------
# 网络
# ----------------------------------------------------------
networks:
  coal_mine_net:
    driver: bridge
